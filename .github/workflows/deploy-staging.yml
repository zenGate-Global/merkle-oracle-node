name: Deploy to Staging

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Docker image tag to deploy (e.g., v1.0.3)'
        required: true
        type: string

env:
  PROJECT_ID: merkle-oracle-staging
  REGION: europe-west1
  ZONE: europe-west1-b
  IMAGE_NAME: merkle-oracle-node
  MIG_NAME: merkle-oracle-node-mig-staging
  DOMAIN: merkle-staging2.zengate-dev.com

jobs:
  build:
    name: Build and Push Image
    runs-on: ubuntu-latest
    environment: merkle-staging
    
    permissions:
      contents: read
      id-token: write
    
    outputs:
      image: ${{ steps.image-info.outputs.image }}
      tag: ${{ steps.image-info.outputs.tag }}

    steps:
      - name: Set tag
        id: set-tag
        run: |
          TAG="${{ github.event.inputs.tag }}"
          echo "tag=$TAG" >> $GITHUB_OUTPUT

      - name: Checkout code
        uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.WIF_PROVIDER }}
          service_account: ${{ secrets.WIF_SERVICE_ACCOUNT }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2
        with:
          project_id: ${{ env.PROJECT_ID }}

      - name: Configure Docker for Artifact Registry
        run: |
          set -euo pipefail
          gcloud auth configure-docker ${{ env.REGION }}-docker.pkg.dev

      - name: Build Docker image
        run: |
          set -euo pipefail
          TAG="${{ steps.set-tag.outputs.tag }}"
          IMAGE="${{ env.REGION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/${{ env.IMAGE_NAME }}/${{ env.IMAGE_NAME }}"
          
          docker build -t $IMAGE:$TAG .
          docker tag $IMAGE:$TAG $IMAGE:latest

      - name: Push Docker image to Artifact Registry
        run: |
          set -euo pipefail
          TAG="${{ steps.set-tag.outputs.tag }}"
          IMAGE="${{ env.REGION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/${{ env.IMAGE_NAME }}/${{ env.IMAGE_NAME }}"
          
          docker push $IMAGE:$TAG
          docker push $IMAGE:latest

      - name: Set image info for next jobs
        id: image-info
        run: |
          TAG="${{ steps.set-tag.outputs.tag }}"
          IMAGE="${{ env.REGION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/${{ env.IMAGE_NAME }}/${{ env.IMAGE_NAME }}"
          echo "image=$IMAGE" >> $GITHUB_OUTPUT
          echo "tag=$TAG" >> $GITHUB_OUTPUT

  deploy:
    name: Deploy to MIG
    runs-on: ubuntu-latest
    needs: build
    environment: merkle-staging
    
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout infrastructure code
        uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.WIF_PROVIDER }}
          service_account: ${{ secrets.WIF_SERVICE_ACCOUNT }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2
        with:
          project_id: ${{ env.PROJECT_ID }}

      - name: Get current instance template
        id: current-template
        run: |
          set -euo pipefail
          
          # Get the current template used by MIG
          CURRENT_TEMPLATE=$(gcloud compute instance-groups managed describe ${{ env.MIG_NAME }} \
            --zone=${{ env.ZONE }} \
            --format="value(instanceTemplate)" | awk -F'/' '{print $NF}')
          
          echo "current_template=$CURRENT_TEMPLATE" >> $GITHUB_OUTPUT
          echo "Current template: $CURRENT_TEMPLATE"

      - name: Create new instance template with updated image
        id: new-template
        run: |
          set -euo pipefail
          
          TAG="${{ needs.build.outputs.tag }}"
          IMAGE="${{ needs.build.outputs.image }}:$TAG"
          TIMESTAMP=$(date +%Y%m%d%H%M%S)
          NEW_TEMPLATE="${{ env.IMAGE_NAME }}-template-staging-$TIMESTAMP"
          
          echo "Creating template: $NEW_TEMPLATE"
          
          # Use the startup script from the repository and replace all template variables
          sed -e "s|\${app_name}|${{ env.IMAGE_NAME }}|g" \
              -e "s|\${project_id}|${{ env.PROJECT_ID }}|g" \
              -e "s|\${region}|${{ env.REGION }}|g" \
              -e "s|\${image_tag}|$TAG|g" \
              -e "s|\${secret_name}|merkle-oracle-staging-config|g" \
              -e "s|\${domain}|${{ env.DOMAIN }}|g" \
              -e "s|\${app_port}|8080|g" \
            devops/infrastructure/terraform/scripts/ubuntu-startup.sh.tpl > /tmp/startup-script-updated.sh
          
          # Create new template with all parameters
          gcloud compute instance-templates create $NEW_TEMPLATE \
            --machine-type=e2-medium \
            --network-interface=network-tier=PREMIUM,address=34.14.39.221 \
            --metadata-from-file=startup-script=/tmp/startup-script-updated.sh \
            --metadata=enable-oslogin=TRUE \
            --maintenance-policy=MIGRATE \
            --provisioning-model=STANDARD \
            --service-account=merkle-oracle-node-sa-staging@merkle-oracle-staging.iam.gserviceaccount.com \
            --scopes=https://www.googleapis.com/auth/cloud-platform \
            --tags=merkle-oracle-node-web,allow-health-check \
            --create-disk=auto-delete=yes,boot=yes,device-name=persistent-disk-0,image=projects/ubuntu-os-cloud/global/images/family/ubuntu-2204-lts,mode=rw,size=100,type=pd-ssd \
            --project=${{ env.PROJECT_ID }} \
            --region=${{ env.REGION }}
          
          echo "new_template=$NEW_TEMPLATE" >> $GITHUB_OUTPUT

      - name: Update MIG to use new template
        run: |
          set -euo pipefail
          
          NEW_TEMPLATE="${{ steps.new-template.outputs.new_template }}"
          
          gcloud compute instance-groups managed set-instance-template ${{ env.MIG_NAME }} \
            --template=$NEW_TEMPLATE \
            --zone=${{ env.ZONE }} \
            --project=${{ env.PROJECT_ID }}

      - name: Rolling restart of MIG instances
        run: |
          set -euo pipefail
          
          gcloud compute instance-groups managed rolling-action restart ${{ env.MIG_NAME }} \
            --zone=${{ env.ZONE }} \
            --max-unavailable=1 \
            --project=${{ env.PROJECT_ID }}

      - name: Clean up old instance templates
        if: success()
        run: |
          set -euo pipefail
          
          gcloud compute instance-templates list \
            --filter="name:${{ env.IMAGE_NAME }}-template-staging-*" \
            --format="value(name)" \
            --sort-by="~creationTimestamp" \
            --project=${{ env.PROJECT_ID }} | \
            tail -n +6 | \
            xargs -r -I {} gcloud compute instance-templates delete {} --quiet --project=${{ env.PROJECT_ID }} || true

  verify:
    name: Verify Deployment
    runs-on: ubuntu-latest
    needs: [build, deploy]
    environment: merkle-staging
    
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.WIF_PROVIDER }}
          service_account: ${{ secrets.WIF_SERVICE_ACCOUNT }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2
        with:
          project_id: ${{ env.PROJECT_ID }}

      - name: Get instance from MIG
        id: get-instance
        run: |
          set -euo pipefail
          
          INSTANCE=$(gcloud compute instance-groups managed list-instances ${{ env.MIG_NAME }} \
            --zone=${{ env.ZONE }} \
            --format="value(NAME)" \
            --project=${{ env.PROJECT_ID }} | head -1)
          
          echo "instance=$INSTANCE" >> $GITHUB_OUTPUT

      - name: Verify application health via SSH
        run: |
          set -euo pipefail
          INSTANCE="${{ steps.get-instance.outputs.instance }}"
          
          for i in {1..30}; do
            if gcloud compute ssh $INSTANCE \
              --zone=${{ env.ZONE }} \
              --tunnel-through-iap \
              --quiet \
              --project=${{ env.PROJECT_ID }} \
              --command="curl -f -s --max-time 5 http://localhost:8080/healthcheck > /dev/null 2>&1"; then
              echo "Health check passed on instance $INSTANCE"
              exit 0
            fi
            echo "Attempt $i failed, retrying in 10s..."
            sleep 10
          done
          
          echo "Health check failed after 30 attempts"
          gcloud compute ssh $INSTANCE \
            --zone=${{ env.ZONE }} \
            --tunnel-through-iap \
            --quiet \
            --project=${{ env.PROJECT_ID }} \
            --command="sudo docker logs ${{ env.IMAGE_NAME }} --tail 50" || true
          exit 1

      - name: Verify HTTPS endpoint
        run: |
          set -euo pipefail
          
          echo "Testing HTTPS endpoint: https://${{ env.DOMAIN }}/healthcheck"
          
          for i in {1..30}; do
            if curl -f -s --max-time 10 https://${{ env.DOMAIN }}/healthcheck > /dev/null 2>&1; then
              echo "HTTPS health check passed"
              
              if curl -f -s --max-time 10 https://${{ env.DOMAIN }}/docs > /dev/null 2>&1; then
                echo "HTTPS docs endpoint passed"
                exit 0
              else
                echo "Docs endpoint not ready yet, retrying..."
              fi
            else
              echo "Attempt $i failed, retrying in 10s..."
            fi
            sleep 10
          done
          
          echo "HTTPS endpoint verification failed after 30 attempts"
          exit 1

  summary:
    name: Deployment Summary
    runs-on: ubuntu-latest
    needs: [build, deploy, verify]
    if: always()
    
    steps:
      - name: Create deployment summary
        run: |
          TAG="${{ needs.build.outputs.tag }}"
          BUILD_STATUS="${{ needs.build.result }}"
          DEPLOY_STATUS="${{ needs.deploy.result }}"
          VERIFY_STATUS="${{ needs.verify.result }}"
          
          if [ "$BUILD_STATUS" = "success" ] && [ "$DEPLOY_STATUS" = "success" ] && [ "$VERIFY_STATUS" = "success" ]; then
            STATUS="SUCCESS"
          else
            STATUS="FAILED"
          fi
          
          cat >> $GITHUB_STEP_SUMMARY << EOF
          ## Deployment $STATUS
          
          - Tag: $TAG
          - Domain: https://${{ env.DOMAIN }}
          - Build: $BUILD_STATUS
          - Deploy: $DEPLOY_STATUS
          - Verify: $VERIFY_STATUS
          EOF

      - name: Notify on failure
        if: needs.build.result == 'failure' || needs.deploy.result == 'failure' || needs.verify.result == 'failure'
        run: |
          echo "Deployment failed"
          exit 1
