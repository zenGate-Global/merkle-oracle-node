name: Deploy to GCP

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Docker image tag to deploy'
        required: true
        type: string

env:
  PROJECT_ID: palm-portal-staging
  REGION: europe-west1
  ZONE: europe-west1-b
  INSTANCE_NAME: merkle-oracle-staging
  IMAGE_NAME: merkle-oracle-node
  DOMAIN: merkle-oracle.zengate-dev.com

jobs:
  deploy:
    name: Deploy to GCP
    runs-on: ubuntu-latest
    environment: staging
    
    permissions:
      contents: read
      id-token: write  # Required for Workload Identity Federation

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # Use Workload Identity Federation (no service account keys needed!)
      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.WIF_PROVIDER }}
          service_account: ${{ secrets.WIF_SERVICE_ACCOUNT }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Configure Docker for Artifact Registry
        run: |
          set -euo pipefail
          gcloud auth configure-docker $REGION-docker.pkg.dev

      - name: Build Docker image
        run: |
          set -euo pipefail
          TAG="${{ github.event.inputs.tag }}"
          IMAGE="$REGION-docker.pkg.dev/$PROJECT_ID/$IMAGE_NAME/$IMAGE_NAME"
          docker build -t $IMAGE:$TAG .
          docker tag $IMAGE:$TAG $IMAGE:latest

      - name: Push Docker image to Artifact Registry
        run: |
          set -euo pipefail
          TAG="${{ github.event.inputs.tag }}"
          IMAGE="$REGION-docker.pkg.dev/$PROJECT_ID/$IMAGE_NAME/$IMAGE_NAME"
          docker push $IMAGE:$TAG
          docker push $IMAGE:latest
          echo "✅ Image pushed: $IMAGE:$TAG"

      - name: Update container image
        run: |
          set -euo pipefail
          TAG="${{ github.event.inputs.tag }}"
          IMAGE="$REGION-docker.pkg.dev/$PROJECT_ID/$IMAGE_NAME/$IMAGE_NAME:$TAG"
          
          gcloud compute instances update-container $INSTANCE_NAME \
            --zone=$ZONE \
            --container-image=$IMAGE \
            --container-restart-policy=always
          
          echo "✅ Container image updated to: $TAG"

      - name: Wait for application to start
        run: |
          echo "Waiting for application to start..."
          sleep 30

      - name: Verify application health
        run: |
          set -euo pipefail
          
          # Single SSH session to check everything
          gcloud compute ssh $INSTANCE_NAME --zone=$ZONE --tunnel-through-iap --quiet --command="
            set -e
            
            # Wait for container to be ready (max 5 minutes)
            for i in {1..30}; do
              if docker ps | grep -q $IMAGE_NAME && \
                 curl -f -s --max-time 5 http://localhost:8080/healthcheck > /dev/null 2>&1; then
                echo 'Application is healthy'
                exit 0
              fi
              echo \"Waiting for application (\\\$i/30)...\"
              sleep 10
            done
            
            # If we get here, health check failed
            echo 'Application health check failed'
            echo 'Container status:'
            docker ps -a
            echo ''
            echo 'Application logs:'
            docker logs \\\$(docker ps -aq --filter name=$IMAGE_NAME) --tail 50 || true
            exit 1
          "

      - name: Verify Caddy and HTTPS
        run: |
          set -euo pipefail
          
          # Check Caddy container
          if ! gcloud compute ssh $INSTANCE_NAME --zone=$ZONE --tunnel-through-iap --quiet --command="docker ps | grep -q merkle-caddy" > /dev/null 2>&1; then
            echo "⚠️  Caddy container is not running"
            gcloud compute ssh $INSTANCE_NAME --zone=$ZONE --tunnel-through-iap --quiet --command="docker ps -a | grep caddy && docker logs merkle-caddy --tail 50" 2>&1 || true
          else
            echo "✅ Caddy container is running"
          fi
          
          # Check HTTPS endpoint
          for i in {1..20}; do
            if curl -f -s --max-time 10 https://$DOMAIN/healthcheck > /dev/null 2>&1; then
              echo "✅ HTTPS endpoint is accessible"
              curl -f -s --max-time 10 https://$DOMAIN/objects?limit=1 > /dev/null 2>&1 && echo "✅ API endpoint is accessible"
              break
            fi
            [ $i -eq 20 ] && echo "⚠️  HTTPS not accessible yet (may need SSL cert provisioning)" && gcloud compute ssh $INSTANCE_NAME --zone=$ZONE --tunnel-through-iap --quiet --command="docker logs merkle-caddy --tail 30" 2>&1 || true
            sleep 15
          done

      - name: Create deployment summary
        if: always()
        run: |
          set +e  # Don't fail on errors in summary
          
          TAG="${{ github.event.inputs.tag }}"
          IMAGE="$REGION-docker.pkg.dev/$PROJECT_ID/$IMAGE_NAME/$IMAGE_NAME:$TAG"
          
          # Get deployment status
          DEPLOY_STATUS="${{ job.status }}"
          if [ "$DEPLOY_STATUS" = "success" ]; then
            STATUS_EMOJI="✅"
          else
            STATUS_EMOJI="❌"
          fi
          
          cat >> $GITHUB_STEP_SUMMARY << EOF
          ## $STATUS_EMOJI Deployment Summary
          
          **Status**: $DEPLOY_STATUS
          
          **Deployment Info**
          - Instance: \`$INSTANCE_NAME\`
          - Zone: \`$ZONE\`
          - Image: \`$IMAGE\`
          - Domain: \`$DOMAIN\`
          
          **Endpoints**
          - Health: https://$DOMAIN/healthcheck
          - Objects: https://$DOMAIN/objects
          - API Docs: https://$DOMAIN/docs
          
          **Quick Commands**
          \`\`\`bash
          # Check health
          curl https://$DOMAIN/healthcheck
          
          # View logs
          gcloud compute ssh $INSTANCE_NAME --zone=$ZONE --command="sudo docker logs merkle-oracle-node --tail 50"
          
          # SSH to instance
          gcloud compute ssh $INSTANCE_NAME --zone=$ZONE
          \`\`\`
          EOF

      - name: Notify on failure
        if: failure()
        run: |
          echo "❌ Deployment failed"
          echo "Logs: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}"
