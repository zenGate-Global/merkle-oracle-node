name: Deploy to GCP Staging

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Docker image tag to deploy (e.g., v1.0.0)'
        required: true
        type: string

env:
  PROJECT_ID: ${{ vars.PROJECT_ID }}
  REGION: ${{ vars.REGION }}
  ZONE: ${{ vars.ZONE }}
  INSTANCE_NAME: ${{ vars.INSTANCE_NAME }}
  IMAGE_NAME: ${{ vars.IMAGE_NAME }}
  DOMAIN: ${{ vars.DOMAIN }}

jobs:
  build:
    name: Build and Push Image
    runs-on: ubuntu-latest
    environment: staging
    
    permissions:
      contents: read
      id-token: write
    
    outputs:
      image: ${{ steps.image-info.outputs.image }}
      tag: ${{ steps.image-info.outputs.tag }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.WIF_PROVIDER }}
          service_account: ${{ secrets.WIF_SERVICE_ACCOUNT }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Configure Docker for Artifact Registry
        run: |
          set -euo pipefail
          gcloud auth configure-docker $REGION-docker.pkg.dev

      - name: Build Docker image
        run: |
          set -euo pipefail
          TAG="${{ github.event.inputs.tag }}"
          IMAGE="$REGION-docker.pkg.dev/$PROJECT_ID/$IMAGE_NAME/$IMAGE_NAME"
          
          docker build -t $IMAGE:$TAG .
          docker tag $IMAGE:$TAG $IMAGE:latest

      - name: Push Docker image to Artifact Registry
        run: |
          set -euo pipefail
          TAG="${{ github.event.inputs.tag }}"
          IMAGE="$REGION-docker.pkg.dev/$PROJECT_ID/$IMAGE_NAME/$IMAGE_NAME"
          
          docker push $IMAGE:$TAG
          docker push $IMAGE:latest

      - name: Set image info for next jobs
        id: image-info
        run: |
          TAG="${{ github.event.inputs.tag }}"
          IMAGE="$REGION-docker.pkg.dev/$PROJECT_ID/$IMAGE_NAME/$IMAGE_NAME"
          echo "image=$IMAGE" >> $GITHUB_OUTPUT
          echo "tag=$TAG" >> $GITHUB_OUTPUT

  deploy:
    name: Deploy to Instance
    runs-on: ubuntu-latest
    needs: build
    environment: staging
    
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.WIF_PROVIDER }}
          service_account: ${{ secrets.WIF_SERVICE_ACCOUNT }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Update container on instance
        run: |
          set -euo pipefail
          IMAGE="${{ needs.build.outputs.image }}:${{ needs.build.outputs.tag }}"
          
          gcloud compute instances update-container $INSTANCE_NAME \
            --zone=$ZONE \
            --container-image=$IMAGE \
            --container-restart-policy=always

      - name: Wait for container restart
        run: sleep 45

  verify:
    name: Verify Deployment
    runs-on: ubuntu-latest
    needs: [build, deploy]
    environment: staging
    
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.WIF_PROVIDER }}
          service_account: ${{ secrets.WIF_SERVICE_ACCOUNT }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Verify application health
        run: |
          set -euo pipefail
          
          gcloud compute ssh $INSTANCE_NAME --zone=$ZONE --tunnel-through-iap --quiet --command="
            set -e
            
            for i in {1..30}; do
              if docker ps | grep -q $IMAGE_NAME && \
                 curl -f -s --max-time 5 http://localhost:8080/healthcheck > /dev/null 2>&1; then
                exit 0
              fi
              sleep 10
            done
            
            echo 'Application health check failed'
            docker ps -a
            docker logs \$(docker ps -aq --filter name=$IMAGE_NAME) --tail 50 || true
            exit 1
          "

      - name: Verify Caddy proxy
        run: |
          set -euo pipefail
          
          if ! gcloud compute ssh $INSTANCE_NAME --zone=$ZONE --tunnel-through-iap --quiet --command="docker ps | grep -q merkle-caddy" > /dev/null 2>&1; then
            echo "Caddy container is not running"
            gcloud compute ssh $INSTANCE_NAME --zone=$ZONE --tunnel-through-iap --quiet --command="docker ps -a | grep caddy && docker logs merkle-caddy --tail 50" 2>&1 || true
            exit 1
          fi

      - name: Verify HTTPS endpoints
        run: |
          set -euo pipefail
          
          for i in {1..20}; do
            if curl -f -s --max-time 10 https://$DOMAIN/healthcheck > /dev/null 2>&1; then
              curl -f -s --max-time 10 https://$DOMAIN/objects?limit=1 > /dev/null 2>&1 || true
              exit 0
            fi
            
            if [ $i -eq 20 ]; then
              echo "HTTPS endpoints not accessible"
              gcloud compute ssh $INSTANCE_NAME --zone=$ZONE --tunnel-through-iap --quiet --command="docker logs merkle-caddy --tail 30" 2>&1 || true
              exit 1
            fi
            
            sleep 15
          done

  summary:
    name: Deployment Summary
    runs-on: ubuntu-latest
    needs: [build, deploy, verify]
    if: always()
    
    steps:
      - name: Create deployment summary
        run: |
          TAG="${{ needs.build.outputs.tag }}"
          IMAGE="${{ needs.build.outputs.image }}:$TAG"
          BUILD_STATUS="${{ needs.build.result }}"
          DEPLOY_STATUS="${{ needs.deploy.result }}"
          VERIFY_STATUS="${{ needs.verify.result }}"
          
          if [ "$BUILD_STATUS" = "success" ] && [ "$DEPLOY_STATUS" = "success" ] && [ "$VERIFY_STATUS" = "success" ]; then
            OVERALL_STATUS="SUCCESS"
          else
            OVERALL_STATUS="FAILED"
          fi
          
          cat >> $GITHUB_STEP_SUMMARY << EOF
          ## Deployment Summary
          
          **Status**: $OVERALL_STATUS
          
          **Image**: \`$IMAGE\`  
          **Instance**: \`$INSTANCE_NAME\`  
          **Domain**: https://$DOMAIN
          
          **Job Results**: Build ($BUILD_STATUS) | Deploy ($DEPLOY_STATUS) | Verify ($VERIFY_STATUS)
          
          **Endpoints**:
          - https://$DOMAIN/healthcheck
          - https://$DOMAIN/objects
          - https://$DOMAIN/docs
          EOF

      - name: Notify on failure
        if: needs.build.result == 'failure' || needs.deploy.result == 'failure' || needs.verify.result == 'failure'
        run: |
          echo "Deployment failed. View logs at: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          exit 1
