name: "🚀 Deploy to Compute Engine"

on:
  push:
    tags:
      - 'v*.*.*'

  release:
    types: [published]

  workflow_dispatch:
    inputs:
      environment:
        description: 'Deployment environment'
        required: true
        default: 'staging'
        type: choice
        options:
          - staging
          - production
      tag:
        description: 'Git tag to deploy (e.g., v1.0.0)'
        required: true
        type: string

permissions:
  contents: read
  id-token: write

env:
  PROJECT_ID: "palm-portal-staging"
  REGION: "europe-west1"
  ZONE: "europe-west1-b"
  ARTIFACT_REGISTRY_REPO: "merkle-oracle-node"

jobs:
  deploy:
    name: "Deploy to ${{ github.event.inputs.environment || 'staging' }}"
    runs-on: ubuntu-latest
    environment: ${{ github.event.inputs.environment || 'staging' }}
    if: github.event_name == 'workflow_dispatch' || github.event_name == 'push' || github.event_name == 'release'
    steps:
      - name: Checkout code
        uses: actions/checkout@v5
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}
      
      - name: Set deployment variables
        id: vars
        run: |
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            ENVIRONMENT="${{ github.event.inputs.environment }}"
            TAG="${{ github.event.inputs.tag }}"
          elif [[ "${{ github.event_name }}" == "release" ]]; then
            ENVIRONMENT="staging"
            TAG="${{ github.event.release.tag_name }}"
          else
            ENVIRONMENT="staging"
            TAG="${GITHUB_REF#refs/tags/}"
          fi

          if [[ "$ENVIRONMENT" == "production" ]]; then
            INSTANCE_NAME="merkle-oracle-node"
          else
            INSTANCE_NAME="merkle-oracle-ubuntu"
          fi

          IMAGE_NAME="${{ env.REGION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/${{ env.ARTIFACT_REGISTRY_REPO }}/merkle-oracle-node"
          IMAGE_TAG="${IMAGE_NAME}:${TAG}"

          echo "environment=${ENVIRONMENT}" >> $GITHUB_OUTPUT
          echo "tag=${TAG}" >> $GITHUB_OUTPUT
          echo "instance_name=${INSTANCE_NAME}" >> $GITHUB_OUTPUT
          echo "image_tag=${IMAGE_TAG}" >> $GITHUB_OUTPUT
      
      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2
        with:
          project_id: ${{ env.PROJECT_ID }}

      - name: Configure Docker for Artifact Registry
        run: |
          gcloud auth configure-docker ${{ env.REGION }}-docker.pkg.dev

      - name: Build and push Docker image
        run: |
          docker build -t ${{ steps.vars.outputs.image_tag }} .
          docker push ${{ steps.vars.outputs.image_tag }}
      
      - name: Setup config file
        run: |
          gcloud secrets versions access latest --secret="merkle-oracle-config" > /tmp/config.yaml

      - name: Deploy to Compute Engine (Zero-Downtime)
        run: |
          # Trigger zero-downtime deployment via metadata
          echo "Triggering zero-downtime deployment of ${{ steps.vars.outputs.image_tag }}"

          # Set deployment request in instance metadata
          gcloud compute instances add-metadata ${{ steps.vars.outputs.instance_name }} \
            --zone=${{ env.ZONE }} \
            --metadata=deploy-image="${{ steps.vars.outputs.image_tag }}",deploy-timestamp="$(date +%s)"

          echo "Deployment request sent. The deployment agent on the VM will handle the update without downtime."

      - name: Monitor deployment progress
        run: |
          echo "Monitoring zero-downtime deployment progress..."

          # Wait for deployment agent to process the request (up to 3 minutes)
          for i in {1..18}; do
            # Check if deployment metadata is still present (agent removes it when done)
            DEPLOY_IMAGE=$(gcloud compute instances describe ${{ steps.vars.outputs.instance_name }} --zone=${{ env.ZONE }} --format="value(metadata.items[key=deploy-image].value)" 2>/dev/null || echo "")

            if [ -z "$DEPLOY_IMAGE" ]; then
              echo "✅ Deployment metadata cleared - deployment completed!"
              break
            fi

            echo "Deployment in progress... (attempt $i/18)"
            sleep 10
          done

          # Get the external IP for health check
          EXTERNAL_IP=$(gcloud compute instances describe ${{ steps.vars.outputs.instance_name }} --zone=${{ env.ZONE }} --format="value(networkInterfaces[0].accessConfigs[0].natIP)")

          # Final health check
          echo "Performing final health check on http://$EXTERNAL_IP:8080/healthcheck"
          for i in {1..6}; do
            if curl -f -s "http://$EXTERNAL_IP:8080/healthcheck" >/dev/null; then
              echo "✅ Zero-downtime deployment successful!"
              echo "Service is running with image: ${{ steps.vars.outputs.image_tag }}"
              curl -s "http://$EXTERNAL_IP:8080/healthcheck"
              exit 0
            fi
            echo "Health check attempt $i failed, retrying in 5 seconds..."
            sleep 5
          done

          echo "❌ Health check failed - deployment may have issues"
          echo "Check deployment agent logs: sudo journalctl -u merkle-oracle-deploy-agent.service -n 50"
          exit 1
