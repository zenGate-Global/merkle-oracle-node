name: "🚀 Deploy to Compute Engine"

on:
  push:
    tags:
      - 'v*.*.*'

  release:
    types: [published]

  workflow_dispatch:
    inputs:
      environment:
        description: 'Deployment environment'
        required: true
        default: 'staging'
        type: choice
        options:
          - staging
          - production
      tag:
        description: 'Git tag to deploy (e.g., v1.0.0)'
        required: true
        type: string

permissions:
  contents: read
  id-token: write

env:
  PROJECT_ID: "palm-portal-staging"
  REGION: "europe-west1"
  ZONE: "europe-west1-b"
  ARTIFACT_REGISTRY_REPO: "merkle-oracle-node"

jobs:
  deploy:
    name: "Deploy to ${{ github.event.inputs.environment || 'staging' }}"
    runs-on: ubuntu-latest
    environment: ${{ github.event.inputs.environment || 'staging' }}
    if: github.event_name == 'workflow_dispatch' || github.event_name == 'push' || github.event_name == 'release'
    steps:
      - name: Checkout code
        uses: actions/checkout@v5
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}
      
      - name: Set deployment variables
        id: vars
        run: |
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            ENVIRONMENT="${{ github.event.inputs.environment }}"
            TAG="${{ github.event.inputs.tag }}"
          elif [[ "${{ github.event_name }}" == "release" ]]; then
            ENVIRONMENT="staging"
            TAG="${{ github.event.release.tag_name }}"
          else
            ENVIRONMENT="staging"
            TAG="${GITHUB_REF#refs/tags/}"
          fi

          if [[ "$ENVIRONMENT" == "production" ]]; then
            INSTANCE_NAME="merkle-oracle-node"
          else
            INSTANCE_NAME="merkle-oracle-ubuntu"
          fi

          IMAGE_NAME="${{ env.REGION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/${{ env.ARTIFACT_REGISTRY_REPO }}/merkle-oracle-node"
          IMAGE_TAG="${IMAGE_NAME}:${TAG}"

          echo "environment=${ENVIRONMENT}" >> $GITHUB_OUTPUT
          echo "tag=${TAG}" >> $GITHUB_OUTPUT
          echo "instance_name=${INSTANCE_NAME}" >> $GITHUB_OUTPUT
          echo "image_tag=${IMAGE_TAG}" >> $GITHUB_OUTPUT
      
      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2
        with:
          project_id: ${{ env.PROJECT_ID }}

      - name: Configure Docker for Artifact Registry
        run: |
          gcloud auth configure-docker ${{ env.REGION }}-docker.pkg.dev

      - name: Build and push Docker image
        run: |
          docker build -t ${{ steps.vars.outputs.image_tag }} .
          docker push ${{ steps.vars.outputs.image_tag }}
      
      - name: Setup config file
        run: |
          # Set environment-specific variables
          if [[ "${{ steps.vars.outputs.environment }}" == "production" ]]; then
            NETWORK="mainnet"
            PROFILE="oracle-mainnet"
            EXPLORER_URI="https://cardanoscan.io/transaction/"
            LOG_FILE="mainnet.log"
          else
            NETWORK="preview"
            PROFILE="oracle-preview"
            EXPLORER_URI="https://preview.cardanoscan.io/transaction/"
            LOG_FILE="preview.log"
          fi

          # Create complete config.yaml with ALL secrets injected securely from GitHub
          cat > /tmp/config.yaml << EOF
          storage:
            url: "${{ secrets.DATABASE_URL }}"

          indexer:
            blockfrostURL: "${{ vars.BLOCKFROST_URL }}"
            blockfrostApiKey: "${{ secrets.BLOCKFROST_API_KEY }}"
            ogmiosURL: "${{ vars.OGMIOS_URL }}"
            kupoURL: "${{ vars.KUPO_URL }}"
            utxorpcURL: "${{ vars.UTXORPC_URL }}"
            maestroApiKey: "${{ secrets.MAESTRO_API_KEY }}"
            intercept:
              hash: "${{ vars.INTERCEPT_HASH }}"
              slot: ${{ vars.INTERCEPT_SLOT }}

          submit:
            url: "${{ vars.SUBMIT_URL }}"
            blockFrostProjectID: "${{ secrets.BLOCKFROST_PROJECT_ID }}"

          wallet:
            mnemonic: "${{ secrets.WALLET_MNEMONIC }}"

          logging:
            level: "info"
            log_discord_webook_url: ""
            notification_discord_webhook_url: ""
            explorer_base_uri: "${EXPLORER_URI}"
            log_file_name: "${LOG_FILE}"
            log_directory: "assets/logs"
            max_log_file_size: 100
            max_backups: 3
            max_age: 30

          api:
            blockfrostURL: ""
            blockfrostApiKey: ""
            ogmiosURL: ""
            kupoURL: ""
            utxorpcURL: ""
            maestroApiKey: "${{ secrets.MAESTRO_API_KEY }}"

          cloud:
            gcpCredentialJSONPath: ""
            bucketName: ""
            pinataGatewayURL: "${{ vars.PINATA_GATEWAY_URL }}"
            pinataJWT: "${{ secrets.PINATA_JWT }}"
            retryMaxAttempts: ${{ vars.CLOUD_RETRY_MAX_ATTEMPTS || 50 }}
            retryInitialDelay: "${{ vars.CLOUD_RETRY_INITIAL_DELAY || '10s' }}"
            retryMaxDelay: "${{ vars.CLOUD_RETRY_MAX_DELAY || '300s' }}"

          oracle:
            updateInterval: "${{ vars.ORACLE_UPDATE_INTERVAL }}"
            baseURL: "${{ vars.ORACLE_BASE_URL }}"

          profile: "${PROFILE}"
          network: "${NETWORK}"

          contract:
            contractAddress: "${{ vars.CONTRACT_ADDRESS }}"
            singletonPolicyId: "${{ vars.SINGLETON_POLICY_ID }}"
            singletonName: "${{ vars.SINGLETON_NAME }}"
            merkleOracleScriptRef:
              txId: "96b64c873ed12420fa3da1f2aeed9ed2bcafe9397103dfe9e72e00a52cc6bf25"
              index: 1
          EOF

          # Upload the complete config file to Secret Manager
          gcloud secrets versions add merkle-oracle-config --data-file=/tmp/config.yaml

      - name: Deploy container
        run: |
          gcloud compute ssh ${{ steps.vars.outputs.instance_name }} \
            --zone=${{ env.ZONE }} \
            --command="
              set -eux
              mkdir -p /tmp/config
              gcloud secrets versions access latest --secret='merkle-oracle-config' > /tmp/config/config.yaml
              # Ensure Docker can pull from Artifact Registry with instance SA
              gcloud auth configure-docker europe-west1-docker.pkg.dev --quiet || true
              gcloud auth print-access-token | docker login -u oauth2accesstoken --password-stdin https://europe-west1-docker.pkg.dev
              docker pull ${{ steps.vars.outputs.image_tag }}
              # Prepare isolated network used by ngrok and app
              docker network create merkle-net 2>/dev/null || true
              # Restart application container without exposing host ports
              docker stop app 2>/dev/null || true
              docker rm app 2>/dev/null || true
              docker run -d \
                --name app \
                --network merkle-net \
                --restart unless-stopped \
                -v /tmp/config/config.yaml:/etc/config/config.yaml:ro \
                ${{ steps.vars.outputs.image_tag }}
            " \
            --ssh-flag="-o StrictHostKeyChecking=no"

      - name: Verify deployment
        run: |
          sleep 20
          CONTAINER_STATUS=$(gcloud compute ssh ${{ steps.vars.outputs.instance_name }} \
            --zone=${{ env.ZONE }} \
            --command="docker ps --filter 'name=app' --format '{{.Status}}'" \
            --ssh-flag="-o StrictHostKeyChecking=no" \
            --quiet 2>/dev/null || echo "not found")

          if [[ "$CONTAINER_STATUS" == *"Up"* ]]; then
            echo "Deployment successful"
          else
            gcloud compute ssh ${{ steps.vars.outputs.instance_name }} \
              --zone=${{ env.ZONE }} \
              --command="docker logs app --tail 50" \
              --ssh-flag="-o StrictHostKeyChecking=no" \
              --quiet 2>/dev/null
            exit 1
          fi
