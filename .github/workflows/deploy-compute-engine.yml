name: "🚀 Deploy to Compute Engine"

on:
  push:
    tags:
      - 'v*.*.*'

  release:
    types: [published]

  workflow_dispatch:
    inputs:
      environment:
        description: 'Deployment environment'
        required: true
        default: 'staging'
        type: choice
        options:
          - staging
          - production
      tag:
        description: 'Git tag to deploy (e.g., v1.0.0)'
        required: true
        type: string

permissions:
  contents: read
  id-token: write

env:
  PROJECT_ID: "palm-portal-staging"
  REGION: "europe-west1"
  ZONE: "europe-west1-b"
  ARTIFACT_REGISTRY_REPO: "merkle-oracle-node"

jobs:
  deploy:
    name: "Deploy to ${{ github.event.inputs.environment || 'staging' }}"
    runs-on: ubuntu-latest
    environment: ${{ github.event.inputs.environment || 'staging' }}
    if: github.event_name == 'workflow_dispatch' || github.event_name == 'push' || github.event_name == 'release'
    steps:
      - name: Checkout code
        uses: actions/checkout@v5
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}
      
      - name: Set deployment variables
        id: vars
        run: |
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            ENVIRONMENT="${{ github.event.inputs.environment }}"
            TAG="${{ github.event.inputs.tag }}"
          elif [[ "${{ github.event_name }}" == "release" ]]; then
            ENVIRONMENT="staging"
            TAG="${{ github.event.release.tag_name }}"
          else
            ENVIRONMENT="staging"
            TAG="${GITHUB_REF#refs/tags/}"
          fi

          if [[ "$ENVIRONMENT" == "production" ]]; then
            INSTANCE_NAME="merkle-oracle-node"
          else
            INSTANCE_NAME="merkle-oracle-ubuntu"
          fi

          IMAGE_NAME="${{ env.REGION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/${{ env.ARTIFACT_REGISTRY_REPO }}/merkle-oracle-node"
          IMAGE_TAG="${IMAGE_NAME}:${TAG}"

          echo "environment=${ENVIRONMENT}" >> $GITHUB_OUTPUT
          echo "tag=${TAG}" >> $GITHUB_OUTPUT
          echo "instance_name=${INSTANCE_NAME}" >> $GITHUB_OUTPUT
          echo "image_tag=${IMAGE_TAG}" >> $GITHUB_OUTPUT
      
      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2
        with:
          project_id: ${{ env.PROJECT_ID }}

      - name: Configure Docker for Artifact Registry
        run: |
          gcloud auth configure-docker ${{ env.REGION }}-docker.pkg.dev

      - name: Build and push Docker image
        run: |
          docker build -t ${{ steps.vars.outputs.image_tag }} .
          docker push ${{ steps.vars.outputs.image_tag }}

      - name: Ensure external IP and firewall for HTTPS
        run: |
          set -eux
          INSTANCE=${{ steps.vars.outputs.instance_name }}
          ZONE=${{ env.ZONE }}
          NET_URI=$(gcloud compute instances describe "$INSTANCE" --zone="$ZONE" --format='get(networkInterfaces[0].network)')
          NET_NAME=${NET_URI##*/}
          EXT_IP=$(gcloud compute instances describe "$INSTANCE" --zone="$ZONE" --format='get(networkInterfaces[0].accessConfigs[0].natIP)' || true)
          if [[ -z "${EXT_IP:-}" ]]; then
            gcloud compute instances add-access-config "$INSTANCE" --zone="$ZONE" --access-config-name="external-nat" --network-interface="nic0"
          fi
          # Add tag for firewall targeting
          gcloud compute instances add-tags "$INSTANCE" --zone="$ZONE" --tags=web-https --no-user-output-enabled || true
          # Create firewall rule if missing
          FW_RULE=allow-http-https-web-https-tag
          gcloud compute firewall-rules describe "$FW_RULE" >/dev/null 2>&1 || \
            gcloud compute firewall-rules create "$FW_RULE" \
              --allow=tcp:80,tcp:443 \
              --target-tags=web-https \
              --direction=INGRESS \
              --priority=1000 \
              --network="$NET_NAME"

      - name: Deploy container
        run: |
          gcloud compute ssh ${{ steps.vars.outputs.instance_name }} \
            --zone=${{ env.ZONE }} \
            --command="
              set -eux
              sudo mkdir -p /tmp/config
              gcloud secrets versions access latest --secret='merkle-oracle-config' | sudo tee /tmp/config/config.yaml >/dev/null
              # Ensure Docker can pull from Artifact Registry with instance SA
              gcloud auth configure-docker europe-west1-docker.pkg.dev --quiet || true
              gcloud auth print-access-token | sudo docker login -u oauth2accesstoken --password-stdin https://europe-west1-docker.pkg.dev
              sudo docker pull ${{ steps.vars.outputs.image_tag }}
              # Prepare isolated network used by ngrok and app
              sudo docker network create merkle-net 2>/dev/null || true
              # Restart application container without exposing host ports
              sudo docker stop app 2>/dev/null || true
              sudo docker rm app 2>/dev/null || true
              sudo docker run -d \
                --name app \
                --network merkle-net \
                --restart unless-stopped \
                -v /tmp/config/config.yaml:/etc/config/config.yaml:ro \
                ${{ steps.vars.outputs.image_tag }}

              # Prepare/Run Caddy reverse proxy for HTTPS on the VM
              sudo tee /tmp/Caddyfile >/dev/null <<'CADDY'
              merkle-staging.zengate-dev.com {
                encode zstd gzip
                reverse_proxy app:8080
              }
              CADDY
              sudo docker stop caddy 2>/dev/null || true
              sudo docker rm caddy 2>/dev/null || true
              sudo docker volume create caddy_data >/dev/null
              sudo docker volume create caddy_config >/dev/null
              sudo docker run -d \
                --name caddy \
                --network merkle-net \
                --restart unless-stopped \
                -p 80:80 -p 443:443 \
                -v /tmp/Caddyfile:/etc/caddy/Caddyfile:ro \
                -v caddy_data:/data \
                -v caddy_config:/config \
                caddy:2-alpine
            " \
            --ssh-flag="-o StrictHostKeyChecking=no"

      - name: Verify deployment
        run: |
          sleep 20
          CONTAINER_STATUS=$(gcloud compute ssh ${{ steps.vars.outputs.instance_name }} \
            --zone=${{ env.ZONE }} \
            --command="sudo docker ps --filter 'name=app' --format '{{.Status}}'" \
            --ssh-flag="-o StrictHostKeyChecking=no" \
            --quiet 2>/dev/null || echo "not found")

          if [[ "$CONTAINER_STATUS" == *"Up"* ]]; then
            echo "Deployment successful"
          else
            gcloud compute ssh ${{ steps.vars.outputs.instance_name }} \
              --zone=${{ env.ZONE }} \
              --command="sudo docker logs app --tail 50" \
              --ssh-flag="-o StrictHostKeyChecking=no" \
              --quiet 2>/dev/null
            exit 1
          fi
