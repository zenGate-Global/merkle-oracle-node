basePath: /
definitions:
  api.PublishRequest:
    properties:
      data:
        items:
          additionalProperties: true
          type: object
        type: array
    required:
    - data
    type: object
  api.PublishResponse:
    properties:
      error:
        type: string
      success:
        type: boolean
      txHash:
        type: string
    type: object
  database.CostStatistics:
    properties:
      averageFee:
        type: number
      earliestSlot:
        type: integer
      latestSlot:
        type: integer
      maxFee:
        type: integer
      minFee:
        type: integer
      totalFees:
        type: integer
      totalTransactions:
        type: integer
    type: object
  database.GetAllObjectIDsResult:
    properties:
      limit:
        type: integer
      objectIds:
        items:
          type: string
        type: array
      offset:
        type: integer
      total:
        type: integer
    type: object
  database.ValueHashWithTimestamp:
    properties:
      proof:
        type: string
      slot:
        type: integer
      timestamp:
        type: string
      valueHash:
        items:
          type: integer
        type: array
    type: object
info:
  contact: {}
  license:
    name: Apache 2.0
    url: http://www.apache.org/licenses/LICENSE-2.0.html
  title: Merkle Oracle Node API
  version: 1.0.0
paths:
  /healthcheck:
    get:
      description: Returns 200 if the service is alive.
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties:
              type: boolean
            type: object
      summary: Health Check
      tags:
      - system
  /keys/{keyHash}:
    get:
      consumes:
      - application/json
      description: Retrieves the current value hash for a specific key hash, along
        with timestamp and slot information.
      parameters:
      - description: Key hash (hex encoded)
        in: path
        name: keyHash
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: Value hash with timestamp and slot
          schema:
            $ref: '#/definitions/database.ValueHashWithTimestamp'
        "400":
          description: Invalid key hash format
          schema:
            additionalProperties:
              type: string
            type: object
        "404":
          description: Key not found
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Internal server error
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Get Value Hash by Key Hash
      tags:
      - objects
  /objects:
    get:
      consumes:
      - application/json
      description: Retrieves a paginated list of all tracked object IDs from the database.
      parameters:
      - description: 'Number of items per page (default: 20, max: 1000)'
        in: query
        name: limit
        type: integer
      - description: 'Number of items to skip (default: 0)'
        in: query
        name: offset
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: Paginated list of object IDs
          schema:
            $ref: '#/definitions/database.GetAllObjectIDsResult'
        "400":
          description: Invalid query parameters
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Internal server error
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Get All Object IDs
      tags:
      - objects
  /objects/{id}:
    get:
      consumes:
      - application/json
      description: Retrieves an object by its ID from the database with key-value
        pairs. Optionally specify a timestamp or slot to get historical state.
      parameters:
      - description: Object ID
        in: path
        name: id
        required: true
        type: string
      - description: RFC3339 timestamp to get object state at specific time (e.g.
          2024-01-15T10:30:00Z). Cannot be used with slot parameter.
        in: query
        name: timestamp
        type: string
      - description: Slot number to get object state at specific slot. Cannot be used
          with timestamp parameter.
        in: query
        name: slot
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: Object data with timestamp and slot
          schema:
            additionalProperties: true
            type: object
        "400":
          description: Invalid ID format, timestamp, slot, or conflicting parameters
          schema:
            additionalProperties:
              type: string
            type: object
        "404":
          description: Object not found
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Internal server error
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Get Object by ID
      tags:
      - objects
  /objects/{id}/keys/{key}:
    get:
      consumes:
      - application/json
      description: Retrieves the current value for a specific object ID and key name,
        along with keyHash, timestamp and slot information.
      parameters:
      - description: Object ID
        in: path
        name: id
        required: true
        type: string
      - description: Key name
        in: path
        name: key
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: Value with keyHash (hex), timestamp and slot
          schema:
            additionalProperties: true
            type: object
        "404":
          description: Key not found
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Internal server error
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Get Value by Key
      tags:
      - objects
  /objects/active:
    get:
      consumes:
      - application/json
      description: Retrieves a paginated list of object IDs that have at least one
        non-deleted key from the database.
      parameters:
      - description: 'Number of items per page (default: 20, max: 1000)'
        in: query
        name: limit
        type: integer
      - description: 'Number of items to skip (default: 0)'
        in: query
        name: offset
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: Paginated list of active object IDs
          schema:
            $ref: '#/definitions/database.GetAllObjectIDsResult'
        "400":
          description: Invalid query parameters
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Internal server error
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Get Active Object IDs
      tags:
      - objects
  /objects/deleted:
    get:
      consumes:
      - application/json
      description: Retrieves a paginated list of object IDs that have no non-deleted
        keys from the database.
      parameters:
      - description: 'Number of items per page (default: 20, max: 1000)'
        in: query
        name: limit
        type: integer
      - description: 'Number of items to skip (default: 0)'
        in: query
        name: offset
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: Paginated list of deleted object IDs
          schema:
            $ref: '#/definitions/database.GetAllObjectIDsResult'
        "400":
          description: Invalid query parameters
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Internal server error
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Get Deleted Object IDs
      tags:
      - objects
  /publish:
    post:
      consumes:
      - application/json
      description: Publishes custom oracle data on-chain immediately, bypassing the
        updateInterval. Items may include "object_id"; if missing it will be generated.
      parameters:
      - description: Oracle data to publish
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/api.PublishRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/api.PublishResponse'
        "400":
          description: Invalid request body
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Internal server error
          schema:
            additionalProperties:
              type: string
            type: object
        "503":
          description: Chain event processor not available
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Publish Custom Data Immediately
      tags:
      - system
  /statistics/costs:
    get:
      consumes:
      - application/json
      description: Retrieves transaction fee statistics including total fees, averages,
        min/max values, and slot information.
      produces:
      - application/json
      responses:
        "200":
          description: Cost statistics
          schema:
            $ref: '#/definitions/database.CostStatistics'
        "500":
          description: Internal server error
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Get Cost Statistics
      tags:
      - statistics
schemes:
- http
- https
swagger: "2.0"
tags:
- description: Object Queries
  name: objects
- description: System status and health monitoring endpoints
  name: system
- description: Statistics and analytics endpoints
  name: statistics
